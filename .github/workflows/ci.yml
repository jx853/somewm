name: CI

on:
  workflow_dispatch:
  push:
    branches: [main ci-test]
  pull_request:
    branches: [main ci-test]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        lua:
          - name: LuaJIT
            pkg: luajit
            dev_package: libluajit-5.1-dev
            interpreter: luajit
          - name: Lua 5.2
            pkg: lua5.2
            dev_package: liblua5.2-dev
            interpreter: lua5.2
          - name: Lua 5.3
            pkg: lua5.3
            dev_package: liblua5.3-dev
            interpreter: lua5.3

    name: Build & Test (${{ matrix.lua.name }})

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            pkg-config \
            libwayland-dev \
            libinput-dev \
            libdbus-1-dev \
            libgbm-dev \
            libudev-dev \
            libseat-dev \
            libxcb1-dev \
            libxcb-icccm4-dev \
            libxcb-composite0-dev \
            libxcb-render0-dev \
            libxcb-render-util0-dev \
            libxcb-res0-dev \
            libxcb-ewmh-dev \
            libxcb-xinput-dev \
            libxcb-util-dev \
            hwdata \
            libdisplay-info-dev \
            libliftoff-dev \
            ${{ matrix.lua.interpreter }} \
            ${{ matrix.lua.dev_package }} \
            lua-busted \
            lua-lgi \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libglib2.0-dev \
            libgirepository1.0-dev \
            gir1.2-pango-1.0 \
            gir1.2-gdk-3.0 \
            gir1.2-rsvg-2.0 \
            libxml2-dev \
            bison \
            foot \
            xterm \
            xwayland \
            zsh \
            bc \
            wget

      - name: Upgrade meson
        run: pip install --upgrade --break-system-packages meson

      - name: Cache deps
        id: cache-deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/deps-install
          key: deps-wayland-pixman-xkbcommon-wlroots-v3-${{ runner.os }}

      - name: Build wayland, pixman, libdrm, xkbcommon, and wayland-protocols
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/deps-install

          # Build wayland 1.24.0
          cd ~
          git clone --depth 1 --branch 1.24.0 https://gitlab.freedesktop.org/wayland/wayland.git
          cd wayland
          meson setup build --prefix=$HOME/deps-install -Ddocumentation=false -Dtests=false
          ninja -C build
          ninja -C build install

          # Build pixman 0.46.0
          cd ~
          git clone --depth 1 --branch pixman-0.46.0 https://gitlab.freedesktop.org/pixman/pixman.git
          cd pixman
          meson setup build --prefix=$HOME/deps-install -Dtests=disabled -Ddemos=disabled
          ninja -C build
          ninja -C build install

          # Build libdrm
          wget https://dri.freedesktop.org/libdrm/libdrm-2.4.134.tar.xz
          tar -xf libdrm-2.4.134.tar.xz
          cd libdrm-2.4.134
          meson setup build/ --prefix=$HOME/deps-install --buildtype=release  -D valgrind=disabled  -Dtests=false
          cd build/
          ninja install


          # Build wayland-protocols 1.47
          cd ~
          git clone --depth 1 --branch 1.47 https://gitlab.freedesktop.org/wayland/wayland-protocols.git
          cd wayland-protocols
          meson setup build --prefix=$HOME/deps-install -Dtests=false
          ninja -C build
          ninja -C build install

          # Build xkbcommon 1.8.0
          cd ~
          wget https://github.com/xkbcommon/libxkbcommon/archive/refs/tags/xkbcommon-1.8.0.tar.gz
          tar -xf xkbcommon-1.8.0.tar.gz
          cd libxkbcommon-xkbcommon-1.8.0
          meson setup build --prefix=$HOME/deps-install -Denable-docs=false -Denable-wayland=false -Denable-x11=false
          ninja -C build
          ninja -C build install

      - name: Build wlroots
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          export PKG_CONFIG_PATH=$HOME/deps-install/share/pkgconfig:$HOME/deps-install/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH
          cd ~
          git clone --depth 1 --branch 0.20.0 https://gitlab.freedesktop.org/wlroots/wlroots.git
          cd wlroots
          meson setup build --prefix=$HOME/deps-install -Dexamples=false -Dxwayland=enabled
          ninja -C build
          ninja -C build install

      - name: Set paths
        run: |
          echo "PATH=$HOME/deps-install/bin:$PATH" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$HOME/deps-install/share/pkgconfig:$HOME/deps-install/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$HOME/deps-install/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Build somewm
        run: make build-test LUA_PKG=${{ matrix.lua.pkg }}

      - name: Run unit tests
        run: make test-unit

      - name: Run integration tests (non-spawning only)
        run: |
          # Exclude tests that need external apps or client spawning
          spawning=$(grep -rl 'require.*_client' tests/test-*.lua | xargs -I{} basename {})
          tests=$(find tests -name 'test-*.lua' -type f \
            ! -name 'test-xwayland-*' \
            ! -name 'test-layer-shell-*' \
            ! -name 'test-dbus-error.lua' \
            ! -name 'test-leak-client.lua' \
            ! -name 'test-transient-stacking.lua' \
            ! -name 'test-output-fake-screen.lua' \
            $(printf '! -name %s ' $spawning) \
            | sort)
          timeout 300 bash tests/run-integration.sh $tests
        timeout-minutes: 6
        env:
          SOMEWM: ./build-test/somewm
          SOMEWM_CLIENT: ./build-test/somewm-client
          HEADLESS: 1
          LIBSEAT_BACKEND: noop
          TEST_TIMEOUT: 45
